
name: Karen Messenger Website Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check Karen Messenger
        run: |
          curl -fsS --max-time 30 \
            https://karen-mesanger.onrender.com/ \
            -o /dev/null

